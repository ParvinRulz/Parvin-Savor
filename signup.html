<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resort Guest Registration</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <style>
      body {
        background:
          linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
          url("/Assets/resortlooks/sea\ view.jpg");
        background-size: cover;
        background-position: center;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .signup-card {
        background: rgba(255, 255, 255, 0.96);
        border-radius: 25px;
        backdrop-filter: blur(10px);
      }

      .resort-icon {
        font-size: 4rem;
        color: #ff4d94;
      }

      .btn-pink {
        background-color: #ff4d94;
        border: none;
        color: white;
        font-weight: 600;
      }

      .btn-pink:hover {
        background-color: #e63c81;
        color: white;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: #ff4d94;
        box-shadow: 0 0 0 0.2rem rgba(255, 77, 148, 0.25);
      }

      footer {
        background: rgba(0, 0, 0, 0.85);
        color: white;
        margin-top: auto;
      }

      .footer-link {
        color: #ffb6d5;
        text-decoration: none;
      }

      .footer-link:hover {
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- Signup Section -->
    <div
      class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center"
    >
      <div
        class="card signup-card shadow-lg border-0 w-100"
        style="max-width: 850px"
      >
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <i class="bi bi-house-heart-fill resort-icon"></i>
            <h1 class="fw-bold mt-3">Welcome to Parvin Savor Resort</h1>
            <p class="text-muted">
              Create your guest account and begin your luxurious getaway.
            </p>
          </div>

          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">First Name</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Enter first name"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Last Name</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Enter last name"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Email Address</label>
                <input
                  type="email"
                  class="form-control"
                  placeholder="Enter email"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Phone Number</label>
                <input
                  type="tel"
                  class="form-control"
                  placeholder="Enter phone number"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Room Preference</label>
                <select class="form-select">
                  <option selected>Select Room Type</option>
                  <option>Standard Room</option>
                  <option>Deluxe Room</option>
                  <option>Executive Suite</option>
                  <option>Private Villa</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Number of Guests</label>
                <input
                  type="number"
                  class="form-control"
                  placeholder="Guests"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Password</label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Create password"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Confirm Password</label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Confirm password"
                />
              </div>

              <div class="col-12">
                <div class="form-check mt-2">
                  <input class="form-check-input" type="checkbox" id="terms" />
                  <label class="form-check-label" for="terms">
                    I agree to the Terms & Conditions and Privacy Policy.
                  </label>
                </div>
              </div>

              <div class="col-12 mt-3">
                <div class="d-grid">
                  <button type="submit" class="btn btn-pink btn-lg">
                    <i class="bi bi-person-plus-fill me-2"></i>
                    Create Account
                  </button>
                </div>
              </div>
            </div>
          </form>

          <div class="text-center mt-4">
            <p class="mb-0">
              Already have an account?
              <a href="#" class="text-decoration-none fw-semibold text-danger">
                Sign In
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
